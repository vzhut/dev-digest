# mcp-server suite — local stdio MCP server (@devdigest/mcp-server).
# Thin wrapper over the DevDigest REST API; tests are hermetic (fake API client,
# in-memory MCP transport, a stdio spawn against an unreachable URL).
# Uses pnpm (pnpm-lock.yaml). No server/ or shared-contract dependency.
name: mcp-server

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-server.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-server.yml'

permissions:
  contents: read

concurrency:
  group: mcp-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
