# devdigest-workflow-version: 1
# Generated by DevDigest. Re-export the agent from DevDigest to update it.
name: DevDigest Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: DevDigest Review
    # Fork PRs get no secrets, so the job is skipped for them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Run the DevDigest agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_POST_AS: github_review
        run: |
          if [ ! -f .devdigest/runner/index.mjs ]; then
            echo "DevDigest is not installed on the base branch yet. Merge the install PR, then re-run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node .devdigest/runner/index.mjs

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devdigest-result
          path: devdigest-result.json
          if-no-files-found: ignore

